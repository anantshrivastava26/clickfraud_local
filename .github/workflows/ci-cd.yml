# Every push and pull request runs the backend smoke test and the frontend build. Pushes to main
# also deploy to EC2 (the deploy job at the bottom).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch or PR. A newer push to a pull request cancels its older run, but runs on main
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only access to the repository by default; the deploy job requests the extra permission it
# needs (id-token) itself.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # httpx is only needed by FastAPI's TestClient, so it is installed here and not in
      # requirements.txt.
      - run: pip install -r requirements.txt httpx
      # There is no separate test suite. This drives the real app end to end in-process (the `with`
      # block runs startup, so the model must load): health, the model summary, a scan of the demo
      # click log that must flag exactly 6 bots (see backend/make_samples.py), and a malformed file
      # that must be rejected with 422.
      - name: Smoke test API
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get("/api/health").json()["model_loaded"]
              model = client.get("/api/model").json()
              assert model["counts"]["sessions"] > 0

              with open("../frontend/public/samples/demo_click_log.csv", "rb") as f:
                  res = client.post("/api/scan", files={"file": ("demo_click_log.csv", f, "text/csv")})
              assert res.status_code == 200, res.text
              counts = res.json()["counts"]
              assert counts["bot"] == 6, counts

              bad = client.post("/api/scan", files={"file": ("bad.csv", b"a,b\n1,2\n", "text/csv")})
              assert bad.status_code == 422, bad.text
          print("API smoke test passed")
          EOF

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # `npm run build` is a TypeScript type-check followed by the Vite build, so type errors fail
      # CI.
      - run: npm run build

  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    # Runs only on main, and only once deploy/ec2/setup-cicd.sh has bootstrapped AWS and set the variables.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    # The deploy role only trusts this environment. Add required reviewers to it for an approval gate.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    # Deploys queue rather than cancel, so a rollout is never cut off halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      # OIDC: GitHub issues a token, AWS exchanges it for short-lived credentials. No stored keys.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Images are tagged with the commit SHA, so every rollout is traceable and can be rolled back,
      # plus :latest. The GitHub Actions cache speeds up rebuilds.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/clickfraud-monitor/backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/clickfraud-monitor/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/clickfraud-monitor/frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/clickfraud-monitor/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Deploys by running deploy/ec2/run.sh on the instance through SSM Run Command: no SSH and no
      # open port 22. The first command exports the image names and the second is the script itself,
      # sent as the command text, so run.sh pulls exactly the images pushed above.
      - name: Roll out on EC2 via SSM
        env:
          BACKEND_IMAGE: ${{ steps.ecr.outputs.registry }}/clickfraud-monitor/backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ steps.ecr.outputs.registry }}/clickfraud-monitor/frontend:${{ github.sha }}
        run: |
          params=$(jq -n \
            --arg env "export BACKEND_IMAGE=$BACKEND_IMAGE FRONTEND_IMAGE=$FRONTEND_IMAGE AWS_REGION=$AWS_REGION" \
            --rawfile script deploy/ec2/run.sh \
            '{commands: [$env, $script]}')
          cmd=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "clickfraud-monitor ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd"
          # Poll up to 60 x 5 s = 5 minutes for the command to finish.
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          # Fail the job unless the rollout command succeeded.
          [ "$status" = "Success" ]

      # Final check against the public URL: the API reports the model loaded, the SPA fallback
      # serves /scan, and the demo scan still flags exactly 6 bots.
      - name: Smoke test live site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for _ in $(seq 1 20); do
            curl -sf "$APP_URL/api/health" | grep -q '"model_loaded":true' && break
            sleep 3
          done
          curl -sf "$APP_URL/api/health" | grep -q '"model_loaded":true' || { echo "API not healthy"; exit 1; }
          curl -sf -o /dev/null "$APP_URL/scan" || { echo "SPA route /scan not served"; exit 1; }
          bots=$(curl -sf -F file=@frontend/public/samples/demo_click_log.csv "$APP_URL/api/scan" | jq '.counts.bot')
          [ "$bots" = "6" ] || { echo "Expected 6 bot devices in demo log, got $bots"; exit 1; }
          echo "Live site healthy; demo scan flagged $bots bots"
