services:
  backend:
    build: ./backend
    environment:
      ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
